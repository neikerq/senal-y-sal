name: Seguimiento

on:
  schedule:
    - cron: "7 12 * * 1"   # lunes 08:07 hora de Caracas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: senales
  cancel-in-progress: false

jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Resumen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.seguimiento
      - name: Guardar
        run: |
          git config user.name "bot-senales"
          git config user.email "bot-senales@users.noreply.github.com"
          [ -f senales.csv ] && git add senales.csv
          git diff --cached --quiet && exit 0
          git commit -m "seguimiento" -q
          git pull --rebase -q && git push -q
