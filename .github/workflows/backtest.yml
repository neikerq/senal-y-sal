name: Backtest

on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Días de historia"
        default: "365"
      pares:
        description: "Pares (separados por espacio)"
        default: "XRPUSDT DOGEUSDT"
      marcos:
        description: "Temporalidades"
        default: "15m 1h"
      sl_max:
        description: "SL máximo en %"
        default: "1.5"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Correr backtest
        run: >
          python -m bot.backtest
          --days ${{ inputs.dias }}
          --symbols ${{ inputs.pares }}
          --tfs ${{ inputs.marcos }}
          --max-risk ${{ inputs.sl_max }}
      - uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: results/
