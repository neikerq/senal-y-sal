name: Señales

on:
  schedule:
    - cron: "1,16,31,46 * * * *"   # 1 min después del cierre de cada vela de 15m (UTC)
  workflow_dispatch:
    inputs:
      prueba:
        description: "Mandar mensaje de prueba a Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: senales
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Revisar señales
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.prueba }}" = "true" ]; then
            python -m bot.signals --test
          else
            python -m bot.signals
          fi
      - name: Guardar estado
        run: |
          git config user.name "bot-senales"
          git config user.email "bot-senales@users.noreply.github.com"
          [ -f state.json ] || exit 0
          git add state.json
          git diff --cached --quiet || (git commit -m "estado" -q && git push -q)
